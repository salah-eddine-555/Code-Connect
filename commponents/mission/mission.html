<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Mission</title>
</head>
  <style>
    /* Conteneur principal : transforme .row en flex propre */
body{
  padding-top: 20px;
}
#section-mission{
 display: flex;
  flex-direction: row;   
  flex-wrap: wrap;        
  justify-content: space-evenly;
  align-items: flex-start; 
  gap: 20px;              
  margin-top: 30px;
  padding: 10px;
}

/* Style des cartes */
.mission-card {
  flex: 1 1 300px;      
  max-width: 350px;
  border: 1px solid #e0e0e0;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  background-color: #fff;
}

.mission-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 16px rgba(0,0,0,0.12);
}
.mission-card .card-text {
  flex-grow: 1;
  font-size: 0.95rem;
  color: #444;
}

/* Style des badges */
.badge {
  font-size: 0.85rem;
  background-color: #f8f9fa;
  color: #333;
  border-radius: 10px;
  padding: 0.4em 0.6em;
}

.badge.bg-secondary {
  background-color: #dee2e6 !important;
}

.badge.bg-success {
  background-color: #198754 !important;
  color: #fff;
}
#add-mission{
    padding: 10px;
    margin-top: 10px;
    max-width: fit-content;
    color: white;
    background-color: #108a00;
    border: none;
    border-radius: 4px;
}

/* === MODAL STYLES (Copied from freelance.css) === */

.modal-container {
  background-color: rgba(0, 0, 0, 0.3);
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  width: 100vw;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 1050; /* Ensure it's above other content */
}

.modal-container.show-modal {
  opacity: 1;
  pointer-events: auto;
}

/* This is the form itself */
#mission-form {
  width: 90%;
  max-width: 500px; /* Good width for a form */
  margin: 20px;
  padding: 20px;
  background-color: whitesmoke;
  border-radius: 4px;
  font-size: 14px; /* Slightly larger text */
  border: #108a00 1px solid;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}
#mission-form h1 {
  color: #0f2027;
  text-align: center;
  margin-bottom: 20px;
}
#mission-form button {
  padding: 10px;
  margin-top: 10px;
  width: 100%;
  color: white;
  background-color: #108a00;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}
#mission-form #close-modal-btn {
  background-color: #f44336; /* Red color for close button */
}

.input-control {
  display: flex;
  flex-direction: column;
  margin-bottom: 15px; /* Add space between fields */
}
.input-control label {
  margin-bottom: 5px;
  font-weight: bold;
}
.input-control input,
.input-control textarea {
  border: 2px solid #f0f0f0;
  border-radius: 4px;
  display: block;
  font-size: 14px;
  padding: 10px;
  width: 100%;
}
.input-control input:focus,
.input-control textarea:focus {
  outline: 0;
  border-color: #108a00; /* Highlight on focus */
}
.input-control .error {
  color: #ff3860;
  font-size: 12px;
  height: 15px;
  margin-top: 2px;
}
.input-control.success input,
.input-control.success textarea {
  border-color: #09c372;
}
.input-control.error input,
.input-control.error textarea {
  border-color: #ff3860;
}
.input-control textarea {
    resize: vertical;
    min-height: 100px;
}
  </style>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Code-Connect</a>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="../freelence.html">Freelance</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="mission.html">Missions</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">service</a>
              </li>
            </ul>
          </div>
        </div>
    </nav>

    

    <h1 class="text-center mb-4 mt-10">Missions disponibles</h1>
    <div class="section-filtrage  container-fluid row   justify-content-evenly">
   
      
    </div>


    <section id="section-mission">
    <button id="add-mission" class="mx-auto d-block">Ajouter une mission</button>
    
    <section id="section-mission">
        </section>
    

    <div class="modal-container" id="mission-modal-container">
        <form id="mission-form">
            <h1>Ajouter une nouvelle mission</h1>
            
            <div class="input-control">
                <label for="title">Titre de la mission</label>
                <input id="title" name="title" type="text">
                <div class="error"></div>
            </div>
            
            <div class="input-control">
                <label for="company">Entreprise</label>
                <input id="company" name="company" type="text">
                <div class="error"></div>
            </div>

            <div class="input-control">
                <label for="description">Description</label>
                <textarea id="description" name="description"></textarea>
                <div class="error"></div>
            </div>
            
            <div class="input-control">
                <label for="location">Localisation</label>
                <input id="location" name="location" type="text">
                <div class="error"></div>
            </div>

            <div class="input-control">
                <label for="duration">Durée</label>
                <input id="duration" name="duration" type="text" placeholder="ex: 1 mois">
                <div class="error"></div>
            </div>

            <div class="input-control">
                <label for="budget">Budget</label>
                <input id="budget" name="budget" type="text" placeholder="ex: 1000 €">
                <div class="error"></div>
            </div>
           
            <button type="submit">Soumettre la mission</button>
            <button type="button" id="close-modal-btn">Fermer</button>
        </form>
    </div>
    
         
    <div class="section-filtrage  container-fluid row   justify-content-evenly">
   
      
    </div>


    <section id="section-mission">
        
                 <!-- Les cartes seront insérées ici dynamiquement -->
      

    </section>
    

    <script src="mission.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
