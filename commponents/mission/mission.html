  <style>
    /* Conteneur principal : transforme .row en flex propre */
body{
  padding-top: 20px;
}
#section-mission{
 display: flex;
  flex-direction: row;   
  flex-wrap: wrap;        
  justify-content: space-evenly;
  align-items: flex-start; 
  gap: 20px;              
  margin-top: 30px;
  padding: 10px;
}

/* Style des cartes */
.mission-card {
  flex: 1 1 300px;      
  max-width: 350px;
  border: 1px solid #e0e0e0;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  background-color: #fff;
}

.mission-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 16px rgba(0,0,0,0.12);
}
.mission-card .card-text {
  flex-grow: 1;
  font-size: 0.95rem;
  color: #444;
}

/* Style des badges */
.badge {
  font-size: 0.85rem;
  background-color: #f8f9fa;
  color: #333;
  border-radius: 10px;
  padding: 0.4em 0.6em;
}

.badge.bg-secondary {
  background-color: #dee2e6 !important;
}

.badge.bg-success {
  background-color: #198754 !important;
  color: #fff;
}
  </style>
